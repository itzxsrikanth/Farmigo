<header class="navbar">
  <a href="{{ url_for('main.home') }}" class="brand">🌾 Farmigo</a>
  <nav style="display:flex; align-items:center;">
    <a href="{{ url_for('main.home') }}">Home</a>
    <a href="{{ url_for('equipment.list_equipment') }}">Browse Equipment</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
      {% if current_user.is_owner() %}
        <a href="{{ url_for('equipment.create') }}">+ List Equipment</a>
      {% endif %}
      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline">Sign out</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Sign in</a>
      <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Get started</a>
    {% endif %}
  </nav>
</header>
